apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: {{ .Values.configServer.replicas }}
  selector:
    matchLabels:
      app: config-server
  template:apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1

  selector:
    matchLabels:
      app: config-server

  template:
    metadata:
      labels:
        app: config-server

    spec:
      containers:
        - name: config-server
          image: kyipyar/config-server:IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector:
    app: config-server

  ports:
    - port: 8888
      targetPort: 8888

  type: ClusterIP
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: {{ .Values.configServer.image }}
          ports:
            - containerPort: {{ .Values.configServer.port }}

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector:
    app: config-server
  ports:
    - port: {{ .Values.configServer.port }}
      targetPort: {{ .Values.configServer.port }}