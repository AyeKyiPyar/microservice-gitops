apiVersion: apps/v1
kind: Deployment
metadata:
  name: category-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: category-service

  template:
    metadata:
      labels:
        app: category-service

    spec:
      containers:
        - name: category-service
          image: kyipyar/category-service:IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes

---
apiVersion: v1
kind: Service
metadata:
  name: category-service
spec:
  selector:
    app: category-service

  ports:
    - port: 8083
      targetPort: 8083

  type: ClusterIP