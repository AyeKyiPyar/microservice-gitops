apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service
          image: kyipyar/product-service:IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service

  ports:
    - port: 8082
      targetPort: 8082

  type: ClusterIP